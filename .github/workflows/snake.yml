name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest

    steps:

      - name: Generate GitHub Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Ankitrawat69
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00C6FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00C6FF

      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
